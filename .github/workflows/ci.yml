name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint (Prettier)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility, layout and keyboard checks (published pages)
        run: npm run test:e2e
      # Draft-only pages (notes, Exp. 007) are built into a separate folder and
      # tested too, so the templates stay green before anything is published.
      - name: Accessibility, layout and keyboard checks (draft pages)
        run: npm run build:drafts && DIST=dist-drafts npm run test:e2e
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
